# Windows x64 build — produces the MSI, the NSIS setup exe, and the bare
# app.exe as artifacts. Mirrors build-macos-intel.yml.
#
# Goes through app/scripts/build-release.ps1 rather than calling
# `npm run tauri build` directly. That wrapper is not optional: it sets the
# --remap-path-prefix RUSTFLAGS that scrub the build machine's $HOME out of
# panic-location strings baked in by `file!()` macros, which `strip =
# "symbols"` cannot remove. RUSTFLAGS is part of Cargo's fingerprint, so a
# compilation made without the remap cannot be reused -- and the "Assert the
# developer path scrub" step below proves it landed. See docs/RELEASING.md.
#
# Publishing stays manual (RELEASING.md step 4) — this workflow builds and
# uploads, it does not create a GitHub Release.
name: build-windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

# Least privilege. No job here writes to the repo: publishing is manual
# (docs/RELEASING.md) and nothing shells out to `gh` or `git push`.
# upload-artifact authenticates with the Actions runtime token, not
# GITHUB_TOKEN, so artifacts still upload fine under read-only.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # Explicit rather than inherited; see ci-windows.yml. The real fix
      # for the Get-FileHash failure is keeping pwsh out of the chain —
      # see the build step.
      PSModulePath: C:\Windows\system32\WindowsPowerShell\v1.0\Modules;C:\Program Files\WindowsPowerShell\Modules
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      # SHA of the `stable` BRANCH, not a tag. The only tag in that repo
      # (v1) points at `master`, where `toolchain` is a required input with
      # no default -- so a dependabot bump onto it would break this job.
      # The explicit `toolchain: stable` below makes the pin safe either way.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          toolchain: stable
          # The bundled Linux CLI is cross-compiled to static musl and
          # shipped inside the installer; rust-lld links it, so no external
          # toolchain is needed. build-linux-cli.ps1 would add the target
          # itself, but doing it here keeps the cache key honest.
          targets: x86_64-unknown-linux-musl

      # shared-key, not the default job-derived key: GitHub scopes cache reads
      # to the current branch plus the default branch. This workflow only runs
      # on workflow_dispatch and v* tags, i.e. never on main, so every new
      # branch used to start stone cold -- measured 813s inside "Build release
      # bundles" on a cold run (32187049792) vs 420s warm (32193464505).
      # warm-rust-cache.yml populates this same key on main.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri
          shared-key: windows-release

      - name: Install frontend deps
        working-directory: app
        run: npm ci

      # Runs build:linux-cli (stages ymux-cli.exe, ymux-linux-x64,
      # remote-manifest.json) then build:frontend, then the Tauri bundler.
      #
      # `shell: cmd` invoking Windows PowerShell, NOT `shell: pwsh`: pwsh
      # rewrites PSModulePath for everything it spawns, and several links
      # down this chain (build-release.ps1 -> npm run tauri build ->
      # beforeBuildCommand -> build:linux-cli) sits a Windows PowerShell
      # 5.1 that then cannot autoload Get-FileHash. Same failure as
      # ci-windows.yml documents.
      #
      # Bundle targets: a tag is a real release and must carry both installers
      # (the published manifest.json advertises msi_url as well as nsis_url).
      # A workflow_dispatch build is for testing, and WiX is the slower of the
      # two bundlers, so those get NSIS only -- which is what updater.rs
      # prefers anyway ("NSIS is preferred over MSI because it handles 'app is
      # running'", updater.rs:53).
      - name: Build release bundles
        working-directory: app
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/build-release.ps1 -Bundles "${{ startsWith(github.ref, 'refs/tags/v') && 'msi,nsis' || 'nsis' }}"

      # The failure that shipped a broken exe by hand on 2026-08-09:
      # `cargo build --release` links fine but leaves the binary in dev
      # mode, loading devUrl (localhost:1420) at startup, so every window
      # is an ERR_CONNECTION_REFUSED page. Going through the Tauri CLI is
      # supposed to prevent that — this asserts it actually did, instead of
      # trusting that the build "succeeded".
      #
      # The test is that THIS build's hashed asset filename is inside the
      # binary. Note `localhost:1420` is embedded either way (the whole
      # config is), so its presence proves nothing.
      - name: Assert the frontend is embedded
        working-directory: app
        shell: pwsh
        run: |
          if (-not (Test-Path "src-tauri/target/release/app.exe")) { throw "app.exe was not produced" }
          # Convert-Path, not the relative string: .NET APIs resolve against
          # the process working directory, which is not PowerShell's location.
          $exe = Convert-Path "src-tauri/target/release/app.exe"
          $asset = (Get-ChildItem dist/assets -Filter *.js | Select-Object -First 1).Name
          if (-not $asset) { throw "no built JS asset in dist/assets to check against" }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $text  = [System.Text.Encoding]::ASCII.GetString($bytes)
          if ($text.Contains($asset)) {
            Write-Host "OK: production build — '$asset' is embedded"
          } else {
            throw "DEV-MODE BINARY: '$asset' is not embedded. It would load devUrl at startup and show ERR_CONNECTION_REFUSED on any machine without a dev server."
          }

      # docs/RELEASING.md documents this check by hand and CI never ran it.
      # build-release.ps1 used to delete app.exe to "force" the remap; that was
      # a no-op (bin artifacts in deps/ are unhashed, so its app-* glob matched
      # nothing, and release/app.exe is a hardlink Cargo just re-creates). The
      # actual guarantee is RUSTFLAGS being in Cargo's fingerprint -- so assert
      # the result instead of deleting things and hoping.
      - name: Assert the developer path scrub
        working-directory: app
        shell: pwsh
        run: |
          $exe   = Convert-Path "src-tauri/target/release/app.exe"
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $text  = [System.Text.Encoding]::ASCII.GetString($bytes)
          if ($text.Contains($env:USERNAME)) {
            throw "UNSCRUBBED BINARY: the build user '$env:USERNAME' appears in app.exe. --remap-path-prefix did not apply; was the build run through build-release.ps1?"
          }
          Write-Host "OK: '$env:USERNAME' does not appear in app.exe"

      - name: Checksums
        working-directory: app/src-tauri/target/release
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Include *.msi, *-setup.exe -Path bundle |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name }
          "{0}  app.exe" -f (Get-FileHash app.exe -Algorithm SHA256).Hash.ToLower()

      - name: Upload MSI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: ymux-windows-msi
          path: app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload NSIS setup
        uses: actions/upload-artifact@v7
        with:
          name: ymux-windows-nsis
          path: app/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      # Handy for a quick smoke test without running an installer.
      - name: Upload bare exe
        uses: actions/upload-artifact@v7
        with:
          name: ymux-windows-exe
          path: app/src-tauri/target/release/app.exe
          if-no-files-found: error
