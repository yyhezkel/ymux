# macOS build — targets macOS 13 Ventura and up.
#
# ARCHITECTURE: two separate builds, one per architecture, run in
# parallel as a matrix:
#
#   x86_64  -> macos-15-intel   -> ymux_x64_macos13.dmg
#   arm64   -> macos-14         -> ymux_arm64_macos13.dmg
#
# Before this there was only the x86_64 build, so Apple Silicon ran the
# whole app under Rosetta. Separate builds rather than one universal
# binary: each download stays roughly half the size of a fat bundle, and
# because the two jobs run concurrently on native runners the wall clock
# does not grow — cargo test for each architecture also runs natively
# instead of being cross-compiled and skipped.
#
# `resources/ymux-linux-x64` stays x86_64 in BOTH jobs on purpose: it is
# a LINUX binary deployed to remote hosts, and has nothing to do with the
# Mac's own architecture.
#
# Deployment target is 13.0 via tauri.macos.conf.json (minimumSystemVersion)
# + MACOSX_DEPLOYMENT_TARGET, so building on a newer image still produces
# a Ventura-compatible app. Note macos-14 is the oldest arm64 image, which
# is fine: every Apple Silicon Mac can run macOS 13+ anyway.
#
# SIGNING: a Developer ID identity + notarisation when the secrets are
# present, ad-hoc signing when they are not, so a fork or a secretless run
# still produces a working local build instead of failing outright. An
# ad-hoc signed app is NOT accepted by Gatekeeper after download — that is
# expected, and the README documents the xattr workaround.
#
# Required secrets for the signed path (all of them, or none):
#   APPLE_CERTIFICATE           base64 of the Developer ID .p12
#   APPLE_CERTIFICATE_PASSWORD  its export password
#   APPLE_SIGNING_IDENTITY      e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_ID / APPLE_PASSWORD   Apple ID + an app-specific password
#   APPLE_TEAM_ID               10-char team identifier
#
# Phase 82: this is no longer a build-only job on a side branch. macOS is
# a supported target on `main`, and this workflow is the ONLY place the
# `cfg(target_os = "macos")` / `cfg(not(windows))` arms are compiled at
# all — ci-windows.yml never sees them. So it runs the same gates
# ci-windows does (cargo test, tsc, frontend build) BEFORE bundling, and
# asserts the frontend is embedded afterwards (CLAUDE.md Rule #13).
#
# On pull_request it runs ONLY those gates: the .app bundle, dmg, signing
# and notarisation steps are skipped (if: github.event_name !=
# 'pull_request'), because a PR needs "the mac arms compile and pass
# tests", not a distributable — the full release path still runs on every
# push to main and on workflow_dispatch, so a bundle-stage break surfaces
# one run after merge at the latest. Measured before the split: the intel
# leg cost every PR ~7 min, ~3 of them bundling.
#
# Ordering note, same shape as ci-windows: the mac host CLI must be staged
# into src-tauri/resources/ymux-cli before any cargo step, because
# tauri.macos.conf.json lists it as a bundle resource and it is gitignored.
# NOTE: the file is still named build-macos-intel.yml so existing
# `gh workflow run` invocations and the CLAUDE.md reference keep working;
# the job itself is no longer Intel-only.
name: build-macos

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    # Bookkeeping-only changes prove nothing here. docs/** is NOT listed —
    # ci-windows owns the vault gate, but keeping the two filters identical
    # means a PR either triggers both workflows or neither. Safe because
    # main has no required checks.
    paths-ignore:
      - 'PROGRESS*.txt'
      - 'FOLLOWUPS.md'
      - 'FOLLOWUPS-ARCHIVE.md'
      - 'BACKLOG.md'
      - 'README*.md'
      - '.claude/**'
  push:
    branches: [main]
    paths-ignore:
      - 'PROGRESS*.txt'
      - 'FOLLOWUPS.md'
      - 'FOLLOWUPS-ARCHIVE.md'
      - 'BACKLOG.md'
      - 'README*.md'
      - '.claude/**'

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. No job here writes to the repo: publishing is manual
# (docs/RELEASING.md) and nothing shells out to `gh` or `git push`.
# upload-artifact authenticates with the Actions runtime token, not
# GITHUB_TOKEN, so artifacts still upload fine under read-only.
permissions:
  contents: read

jobs:
  build:
    strategy:
      # One architecture failing should not hide the other's result.
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            expect_arch: x86_64
            reject_arch: arm64
          - arch: arm64
            runner: macos-14
            target: aarch64-apple-darwin
            expect_arch: arm64
            reject_arch: x86_64
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      BUNDLE_DIR: app/src-tauri/target/${{ matrix.target }}/release/bundle/macos
      DMG_NAME: ymux_${{ matrix.arch }}_macos13.dmg
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      # SHA of the `stable` BRANCH, not a tag. The only tag in that repo
      # (v1) points at `master`, where `toolchain` is a required input with
      # no default -- so a dependabot bump onto it would break this job.
      # The explicit `toolchain: stable` below makes the pin safe either way.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # Keyed on the lockfile: dependency builds dominate the runtime and
      # only change when Cargo.lock does. Separate key per arch — the two
      # matrix legs must not share a cache entry.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri
          key: ${{ matrix.target }}

      # Can we sign for real? A secret cannot be referenced inside `if:`,
      # so resolve it once into a step output and branch on that.
      - name: Resolve signing mode
        id: mode
        env:
          HAVE_CERT: ${{ secrets.APPLE_CERTIFICATE }}
          HAVE_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -n "$HAVE_CERT" ] && [ -n "$HAVE_IDENTITY" ]; then
            echo "signing=developer-id" >> "$GITHUB_OUTPUT"
            echo "Developer ID secrets present - will sign and notarise."
          else
            echo "signing=adhoc" >> "$GITHUB_OUTPUT"
            echo "::warning::No Developer ID secrets - falling back to ad-hoc signing. The .app will NOT pass Gatekeeper after download."
          fi

      - name: Install frontend deps
        working-directory: app
        run: npm ci

      # The mac counterpart of Windows' `npm run build:linux-cli` (which is
      # a PowerShell script and cannot run here). Without this the bundle
      # ships no host CLI, and `resolve_ymux_cli` returns None — which is
      # what made hooks and the MCP server unusable on macOS.
      #
      # Built for THIS leg's architecture only: the app spawns this binary
      # on the user's machine, so it has to match the app it ships inside.
      - name: Stage the mac host CLI
        working-directory: app/src-tauri
        run: |
          set -euo pipefail
          cargo build --release --target ${{ matrix.target }} -p ymux
          cp target/${{ matrix.target }}/release/ymux resources/ymux-cli
          chmod +x resources/ymux-cli
          echo "--- ymux-cli architecture ---"
          lipo -archs resources/ymux-cli

      - name: Assert the CLI is ${{ matrix.expect_arch }}
        working-directory: app/src-tauri
        run: |
          set -euo pipefail
          ARCHS=$(lipo -archs resources/ymux-cli)
          echo "lipo -archs -> $ARCHS"
          case "$ARCHS" in
            *${{ matrix.expect_arch }}*) ;;
            *) echo "::error::ymux-cli is missing ${{ matrix.expect_arch }} (got: $ARCHS)"; exit 1 ;;
          esac
          # A leg that silently produced the OTHER architecture would still
          # "have an arch" and pass a naive check — reject that explicitly.
          case "$ARCHS" in
            *${{ matrix.reject_arch }}*)
              echo "::error::ymux-cli contains ${{ matrix.reject_arch }} in the ${{ matrix.arch }} leg (got: $ARCHS)"; exit 1 ;;
          esac
          echo "OK: ymux-cli is ${{ matrix.expect_arch }} only"

      - name: cargo test
        working-directory: app/src-tauri
        run: cargo test --workspace

      # `npm ci` installs the pinned typescript from app/package.json
      # devDependencies, so this checks the same minor developers use.
      # (There used to be an `npm i --no-save typescript@5` here from when
      # it wasn't a project dependency — ci-windows dropped its copy of
      # that when typescript landed in devDependencies; this one lagged.)
      - name: Type-check
        working-directory: app
        run: npx tsc --noEmit -p tsconfig.json

      # esbuild strips types without checking them, so this is a bundling
      # check, not a type check — it catches bad imports and dead assets.
      - name: Frontend build
        working-directory: app
        run: npm run build:frontend

      # Import the Developer ID identity into a throwaway keychain. Only in
      # the developer-id path; the ad-hoc path needs no identity at all
      # (tauri.macos.conf.json carries signingIdentity "-").
      - name: Import Developer ID certificate
        if: github.event_name != 'pull_request' && steps.mode.outputs.signing == 'developer-id'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW=$(python3 -c "import secrets;print(secrets.token_urlsafe(32))")
          echo "::add-mask::$KEYCHAIN_PW"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without this, codesign blocks on a GUI prompt that never comes.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          # Keep the existing keychains in the search list so system roots resolve.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "--- identities available ---"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # Tauri signs the bundle itself when APPLE_SIGNING_IDENTITY is set.
      # It reads it with env::var_os, so a variable that is SET BUT EMPTY is
      # still Some("") and overrides tauri.macos.conf.json's signingIdentity
      # "-" — codesign then looks for an identity named "" and the whole
      # bundle step dies with "The specified item could not be found in the
      # keychain". A YAML `env:` entry defines the variable even when the
      # expression evaluates to '', which is exactly the ad-hoc case, so the
      # ad-hoc path has to UNSET it rather than blank it.
      # PR runs stop here: everything below produces or validates the
      # distributable, which only main/dispatch runs ship.
      - name: Build (.app bundle)
        if: github.event_name != 'pull_request'
        working-directory: app
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.mode.outputs.signing == 'developer-id' && secrets.APPLE_SIGNING_IDENTITY || '' }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            unset APPLE_SIGNING_IDENTITY
            echo "ad-hoc: APPLE_SIGNING_IDENTITY unset, tauri will use signingIdentity \"-\" from tauri.macos.conf.json"
          else
            echo "developer-id: signing with the identity from secrets"
          fi
          # Every build carries its own number: CFBundleVersion =
          # <version>.<run number>, so Finder / Info.plist say WHICH build a
          # tester is on (two builds of one version were indistinguishable).
          # CFBundleShortVersionString stays the plain release version.
          VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          BUILD="$VER.$GITHUB_RUN_NUMBER"
          echo "bundle version: $BUILD"
          npm run tauri build -- --target ${{ matrix.target }} \
            --config "{\"bundle\":{\"macOS\":{\"bundleVersion\":\"$BUILD\"}}}"

      # Rule #13's mac half. A binary linked without the Tauri CLI embeds
      # no frontend and loads devUrl at startup — every window is
      # ERR_CONNECTION_REFUSED on a machine with no dev server, and the
      # Rust log gives no hint. That shipped twice on Windows before
      # build-windows.yml started asserting; the mac side had no equivalent.
      - name: Assert the frontend is embedded
        if: github.event_name != 'pull_request'
        working-directory: app
        run: |
          BUNDLE=src-tauri/target/${{ matrix.target }}/release/bundle/macos
          # Glob rather than hardcode: the executable inside Contents/MacOS
          # is named by Tauri (productName / mainBinaryName), and guessing
          # it wrong fails this step for a reason that has nothing to do
          # with what it is meant to check.
          BIN=$(find "$BUNDLE" -type f -perm -111 -path '*.app/Contents/MacOS/*' | head -1)
          if [ -z "$BIN" ]; then
            echo "::error::no .app executable under $BUNDLE - here is what the build produced:"
            ls -R "$BUNDLE" || echo "(bundle dir does not exist)"
            exit 1
          fi
          echo "checking $BIN"
          ASSET=$(ls dist/assets/*.js | head -1 | xargs basename)
          test -n "$ASSET" || { echo "::error::no built JS asset in dist/assets to check against"; exit 1; }
          if LC_ALL=C grep -qa "$ASSET" "$BIN"; then
            echo "OK: production build - '$ASSET' is embedded"
          else
            echo "::error::DEV-MODE BINARY: '$ASSET' is not embedded. It would load devUrl at startup and show ERR_CONNECTION_REFUSED on any machine without a dev server."
            exit 1
          fi

      # The point of the architecture split: prove the SHIPPED bundle holds
      # this leg's slice and not the other one. Checked on the .app and on
      # the CLI inside it, because they are built by separate commands and
      # a mismatch there is exactly what would send one of them to Rosetta.
      - name: Assert the .app is ${{ matrix.expect_arch }}
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          BIN=$(find "$BUNDLE_DIR" -type f -perm -111 -path '*.app/Contents/MacOS/*' | head -1)
          echo "--- main executable ---"
          ARCHS=$(lipo -archs "$BIN")
          echo "lipo -archs $BIN -> $ARCHS"
          case "$ARCHS" in
            *${{ matrix.expect_arch }}*) ;;
            *) echo "::error::.app is missing ${{ matrix.expect_arch }} (got: $ARCHS)"; exit 1 ;;
          esac
          case "$ARCHS" in
            *${{ matrix.reject_arch }}*)
              echo "::error::.app contains ${{ matrix.reject_arch }} in the ${{ matrix.arch }} leg (got: $ARCHS)"; exit 1 ;;
          esac
          echo "OK: .app is ${{ matrix.expect_arch }} only"
          echo "--- bundled CLI inside the .app ---"
          APP=$(ls -d "$BUNDLE_DIR"/*.app | head -1)
          CLI=$(find "$APP/Contents/Resources" -name "ymux-cli" -type f | head -1)
          if [ -z "$CLI" ]; then
            echo "::error::ymux-cli not found inside the bundle's Resources"
            find "$APP/Contents/Resources" -maxdepth 2 | head -20
            exit 1
          fi
          CLI_ARCHS=$(lipo -archs "$CLI")
          echo "lipo -archs $CLI -> $CLI_ARCHS"
          case "$CLI_ARCHS" in
            *${{ matrix.expect_arch }}*) ;;
            *) echo "::error::bundled ymux-cli is missing ${{ matrix.expect_arch }} (got: $CLI_ARCHS)"; exit 1 ;;
          esac
          echo "OK: bundled CLI is ${{ matrix.expect_arch }} — the app will not shell out through Rosetta"

      # Notarisation is what actually clears Gatekeeper. Signing alone is
      # not enough for a downloaded app: without a stapled ticket the first
      # launch is still blocked.
      - name: Notarise and staple
        if: github.event_name != 'pull_request' && steps.mode.outputs.signing == 'developer-id'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP=$(ls -d "$BUNDLE_DIR"/*.app | head -1)
          echo "notarising $APP"
          # notarytool takes an archive, not a .app directory.
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarise.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarise.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m
          # Staple the ticket INTO the bundle so first launch works offline.
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

      - name: Verify signature and Gatekeeper
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          APP=$(ls -d "$BUNDLE_DIR"/*.app | head -1)
          echo "--- codesign --verify ---"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # These two blocks used to end in `|| true` and only print. A
          # missing entitlement or a missing hardened-runtime flag fails at
          # LAUNCH, not at build, so a green run proved nothing — that is
          # the gap FOLLOWUPS "HARDENED RUNTIME HAS NEVER BEEN LAUNCHED"
          # is about. They assert now.
          echo "--- codesign -dvvv (identity, runtime flags) ---"
          codesign -dvvv "$APP" 2>&1 | tee "$RUNNER_TEMP/cs.txt" \
            | grep -E "Authority|Identifier|TeamIdentifier|flags|Signature" || true
          # `hardenedRuntime: true` in tauri.macos.conf.json is a REQUEST.
          # Without the runtime flag actually set, every entitlement below
          # is inert and notarisation would reject the bundle.
          if ! grep -qE 'flags=0x[0-9a-f]+\([^)]*runtime[^)]*\)' "$RUNNER_TEMP/cs.txt"; then
            echo "::error::hardened runtime flag is NOT set on the .app"
            grep -E '^CodeDirectory' "$RUNNER_TEMP/cs.txt" || true
            exit 1
          fi
          echo "OK: hardened runtime flag present"

          echo "--- entitlements actually applied ---"
          # `--xml` on older codesign, `:-` on newer. Try both rather than
          # turning a tooling change into a spurious red build.
          codesign -d --entitlements - --xml "$APP" > "$RUNNER_TEMP/ent.plist" 2>/dev/null \
            || codesign -d --entitlements :- "$APP" > "$RUNNER_TEMP/ent.plist" 2>/dev/null \
            || { echo "::error::codesign could not read entitlements off the .app"; exit 1; }
          plutil -lint "$RUNNER_TEMP/ent.plist" \
            || { echo "::error::entitlements blob is not a readable plist — the app is signed without them"; exit 1; }
          plutil -p "$RUNNER_TEMP/ent.plist"
          # Every key is in Entitlements.plist because the runtime BREAKS
          # without it (that file says which symptom maps to which key),
          # not defensively. Assert, don't print.
          for KEY in \
            com.apple.security.cs.allow-jit \
            com.apple.security.cs.allow-unsigned-executable-memory \
            com.apple.security.cs.disable-library-validation \
            com.apple.security.network.client \
            com.apple.security.network.server \
            com.apple.security.files.user-selected.read-write
          do
            VAL=$(/usr/libexec/PlistBuddy -c "Print :$KEY" "$RUNNER_TEMP/ent.plist" 2>/dev/null || echo MISSING)
            if [ "$VAL" != "true" ]; then
              echo "::error::entitlement $KEY is '$VAL' (expected true) — Entitlements.plist did not land"
              exit 1
            fi
            echo "OK: $KEY = true"
          done
          # The sandbox must stay OFF — ymux spawns PTYs and shells out.
          if /usr/libexec/PlistBuddy -c "Print :com.apple.security.app-sandbox" "$RUNNER_TEMP/ent.plist" >/dev/null 2>&1; then
            echo "::error::app-sandbox entitlement appeared — local panes would break"
            exit 1
          fi

          # Same "did the plist actually merge?" question, one file over.
          echo "--- Info.plist merge ---"
          plutil -extract NSAppSleepDisabled raw "$APP/Contents/Info.plist" \
            || { echo "::error::NSAppSleepDisabled missing — Info.plist was not merged into the bundle"; exit 1; }
          echo "--- spctl -a -vv (Gatekeeper) ---"
          set +e
          spctl -a -vv "$APP" 2>&1 | tee "$RUNNER_TEMP/spctl.txt"
          SPCTL_RC=${PIPESTATUS[0]}
          set -e
          if [ "$SPCTL_RC" -eq 0 ] && grep -q "accepted" "$RUNNER_TEMP/spctl.txt"; then
            echo "OK: Gatekeeper accepted the app"
          elif [ "${{ steps.mode.outputs.signing }}" = "adhoc" ]; then
            echo "::warning::spctl rejected the app - expected for an ad-hoc build, which is not a distributable signature. Set the Developer ID secrets to get an accepted one."
          else
            echo "::error::spctl rejected a Developer ID signed build - notarisation or stapling did not take."
            exit 1
          fi

      # Tauri's bundle_dmg.sh drives Finder via AppleScript, which fails on
      # headless runners — build the dmg directly with hdiutil instead.
      - name: Create dmg
        if: github.event_name != 'pull_request'
        working-directory: app/src-tauri/target/${{ matrix.target }}/release/bundle/macos
        env:
          DMG_NAME: ymux_${{ matrix.arch }}_macos13.dmg
        run: |
          set -euo pipefail
          APP=$(ls -d *.app | head -1)
          echo "bundling $APP -> $DMG_NAME"
          mkdir dmg-root
          cp -R "$APP" dmg-root/
          # The Applications symlink is what makes drag-to-install work.
          # Launching straight from the mounted image puts the app under App
          # Translocation, where its bundle path is a randomised read-only
          # mount — see the README note.
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname ymux -srcfolder dmg-root -ov -format UDZO "$DMG_NAME"
          shasum -a 256 "$DMG_NAME"

      - name: Sign and staple the dmg
        if: github.event_name != 'pull_request' && steps.mode.outputs.signing == 'developer-id'
        working-directory: app/src-tauri/target/${{ matrix.target }}/release/bundle/macos
        env:
          DMG_NAME: ymux_${{ matrix.arch }}_macos13.dmg
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$DMG_NAME"
          xcrun notarytool submit "$DMG_NAME" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 30m
          xcrun stapler staple "$DMG_NAME"

      - name: Upload dmg
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ymux-macos-${{ matrix.arch }}-dmg
          path: app/src-tauri/target/${{ matrix.target }}/release/bundle/macos/ymux_${{ matrix.arch }}_macos13.dmg
          if-no-files-found: error

      # tar first — upload-artifact's zip does not preserve the symlinks and
      # exec bits inside a .app bundle, and it would strip the signature.
      - name: Upload .app bundle (tarred)
        if: github.event_name != 'pull_request'
        working-directory: app/src-tauri/target/${{ matrix.target }}/release/bundle/macos
        run: tar -czf ymux-app.tar.gz "$(ls -d *.app | head -1)"
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: ymux-macos-${{ matrix.arch }}-app
          path: app/src-tauri/target/${{ matrix.target }}/release/bundle/macos/ymux-app.tar.gz
          if-no-files-found: error
