# Windows CI — the checks that used to be run by hand on every merge.
#
# Deliberately NOT a DESKTOP build: this workflow proves the tree is
# healthy, in the few minutes you are willing to wait on a PR. Producing
# installers is build-windows.yml's job, on demand.
#
# Split into three PARALLEL jobs (frontend / rust / go) — they share no
# artifacts, and serially they cost ~6 min while the longest of the three
# is ~3.5. Each job re-does its own checkout/setup (~30s); that is the
# price of the parallelism and it is worth it.
#
# The Go control-plane server is built in the `go` job, for linux/amd64 +
# arm64, ON AN UBUNTU RUNNER — deliberately. Those two Linux binaries are
# the entire server artifact (src/addons.rs embeds them with
# include_bytes!), so `go test` on linux exercises the platform that
# actually ships; the old GOOS=windows test run was an accident of the
# runner, not a requirement.
#
# Ordering note that is easy to get wrong: `build:linux-cli` MUST run
# before anything that touches cargo. It is what stages
# src-tauri/resources/ymux-cli.exe, which is gitignored — and Tauri's
# build script hard-fails with "resource path doesn't exist" without it.
# A fresh checkout is exactly that case (see FOLLOWUPS P3).
name: ci-windows

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    # Bookkeeping-only changes prove nothing here. docs/** is NOT listed:
    # a PR that touches only docs/vault/ still needs the vault gate (a bad
    # .vault-lock.json edit is caught nowhere else). Safe because main has
    # no required checks — a skipped run cannot wedge a merge.
    paths-ignore:
      - 'PROGRESS*.txt'
      - 'FOLLOWUPS.md'
      - 'FOLLOWUPS-ARCHIVE.md'
      - 'BACKLOG.md'
      - 'README*.md'
      - '.claude/**'
  push:
    branches: [main]
    paths-ignore:
      - 'PROGRESS*.txt'
      - 'FOLLOWUPS.md'
      - 'FOLLOWUPS-ARCHIVE.md'
      - 'BACKLOG.md'
      - 'README*.md'
      - '.claude/**'

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ci-windows-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. No job here writes to the repo: publishing is manual
# (docs/RELEASING.md) and nothing shells out to `gh` or `git push`.
# upload-artifact authenticates with the Actions runtime token, not
# GITHUB_TOKEN, so artifacts still upload fine under read-only.
permissions:
  contents: read

jobs:
  # Everything that needs only node (+ Windows PowerShell for the .ps1
  # parse-check): the vault gate runs first because it fails in seconds
  # and there is no reason to learn about it minutes into a build.
  frontend:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      # Belt-and-braces so the value reaching Windows PowerShell 5.1 is
      # explicit rather than whatever the runner image happens to set.
      PSModulePath: C:\Windows\system32\WindowsPowerShell\v1.0\Modules;C:\Program Files\WindowsPowerShell\Modules
    steps:
      - uses: actions/checkout@v7

      # Fails in seconds on a syntax error that would otherwise surface
      # fifteen minutes into a release build. `shell: powershell` is Windows
      # PowerShell 5.1 on purpose: it is what actually runs these scripts, and
      # it reads BOM-less UTF-8 as ANSI -- so a non-ASCII character inside a
      # string literal (an em-dash decodes to a smart quote, which the
      # tokenizer treats as a string delimiter) breaks parsing here and
      # nowhere else.
      - name: Parse-check the build scripts
        shell: powershell
        run: |
          $bad = 0
          Get-ChildItem app/scripts/*.ps1 | ForEach-Object {
            $e = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$e)
            if ($e.Count) {
              $bad++
              Write-Host ("FAIL {0}: line {1}: {2}" -f $_.Name, $e[0].Extent.StartLineNumber, $e[0].Message)
            } else {
              Write-Host ("ok   {0}" -f $_.Name)
            }
          }
          exit $bad

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      # THE VAULT GATE. docs/vault/*.md explain the code so an agent can read
      # ~3k lines of prose instead of ~90k lines of source. That trade only
      # works while the prose is true — docs/MODULES.md claimed lib.rs was
      # ~1760 lines long after it had grown to 12,475, and nothing said so.
      #
      # Two checks, both in scripts/vault-check.mjs: sha256 of every covered
      # file against docs/vault/.vault-lock.json (catches drift that arrived
      # via a merge or another worktree, not just via this PR), plus "if you
      # touched covered code, the vault file must have moved too" (which
      # `--write` alone cannot satisfy).
      #
      # It needs nothing but node + git and runs in under a second. The PR
      # title and commit message go through `env:` rather than `${{ }}`
      # inline — they are attacker-controlled text on a fork PR, and inline
      # interpolation would run them as shell.
      - name: Vault freshness gate
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          base=""
          if [ "$EVENT" = "pull_request" ]; then
            base="${BASE_SHA:-}"
          elif [ "$EVENT" = "push" ]; then
            base="${BEFORE_SHA:-}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "no usable base commit (dispatch / new branch / force-push) — hash check only"
            node scripts/vault-check.mjs
            exit 0
          fi
          # Shallow checkout: fetch just the base commit so a two-dot diff has
          # both trees. On a PR the checked-out ref is already base-merged, so
          # two-dot IS the PR diff.
          git fetch --no-tags --depth=1 origin "$base"
          if printf '%s\n%s' "${PR_TITLE:-}" "${HEAD_MSG:-}" | grep -qF '[vault-skip]'; then
            echo "::notice::[vault-skip] present — vault diff check skipped for this run. The hash check still runs."
            node scripts/vault-check.mjs
          else
            node scripts/vault-check.mjs --diff-base "$base"
          fi

      # The cite checker the gate above calls (scripts/vault-cites.mjs) has
      # its own unit tests; nothing else would ever run them. Node only, a
      # few seconds.
      - name: Vault cite checker tests
        shell: bash
        run: node --test scripts/vault-cites.test.mjs

      - name: Install frontend deps
        working-directory: app
        run: npm ci

      # `npm ci` installs the pinned typescript from app/package.json
      # devDependencies, so this checks the same minor developers use.
      - name: Type-check
        working-directory: app
        run: npx tsc --noEmit -p tsconfig.json

      # Phase 87: src/*.test.ts are plain `node --test` files (no vitest, no
      # jsdom) over the pure-logic modules — bidi, RTL, pricing, shortcuts.
      # They existed since Phase 80 but nothing ever ran them, so they were a
      # graveyard: `shortcuts.test.ts` is the regression guard for the
      # accelerator table and has to actually execute. tsconfig excludes
      # src/**/*.test.ts, so the type-check above does not cover these.
      - name: Frontend unit tests
        working-directory: app
        run: npm test

      # esbuild strips types without checking them, so this is a bundling
      # check, not a type check — it catches bad imports and dead assets.
      - name: Frontend build
        working-directory: app
        run: npm run build:frontend

      # Phase 108: the same build is the browser bundle the daemon serves from
      # ~/.ymux/server/www/current (WEB-DESIGN §7.1 (b)). Until the Phase D
      # add-on uploads it, a box is loaded by hand from this artifact.
      - name: Upload the web bundle
        uses: actions/upload-artifact@v7
        with:
          name: ymux-web
          path: app/dist
          if-no-files-found: error

  rust:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Belt-and-braces so the value reaching Windows PowerShell 5.1 is
      # explicit rather than whatever the runner image happens to set.
      # The actual fix for the Get-FileHash failure is `shell: cmd` on the
      # steps that shell out to it — see the Stage CLI resources step.
      PSModulePath: C:\Windows\system32\WindowsPowerShell\v1.0\Modules;C:\Program Files\WindowsPowerShell\Modules
      # `cargo test` runs the dev profile, where incremental is on by default.
      # rust-cache deletes target/debug/incremental before saving, so CI was
      # paying to write incremental state that is thrown away every run.
      CARGO_INCREMENTAL: "0"
      # PDB generation is disproportionately slow on Windows and nothing here
      # reads them. Backtraces keep symbol names, they just lose line numbers.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7

      # No `npm ci` here on purpose: build:linux-cli is a PowerShell script
      # reached via `npm run`, which needs node + package.json but nothing
      # from node_modules. The frontend job owns the installed-deps checks.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # SHA of the `stable` BRANCH, not a tag. The only tag in that repo
      # (v1) points at `master`, where `toolchain` is a required input with
      # no default -- so a dependabot bump onto it would break this job.
      # The explicit `toolchain: 1.95.0` below (kept equal to rust-toolchain.toml)
      # pins rustc and makes the SHA pin safe either way.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          toolchain: 1.95.0

      # Keyed on the lockfile: dependency builds dominate the runtime and
      # only change when Cargo.lock does. Explicit shared-key so this job's
      # dev-profile cache stays separate from the release-profile one that
      # warm-rust-cache.yml maintains for build-windows.yml.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri
          shared-key: windows-dev

      # Stages ymux-cli.exe + ymux-linux-x64 + remote-manifest.json.
      # The musl cross-build links with rust-lld (see src-tauri/.cargo/
      # config.toml), so no external linker is needed on a Windows runner.
      # Fails in seconds if the cmdlet is unreachable, rather than four
      # minutes into a musl cross-build. Must use the same shell as the
      # step below or it does not prove anything.
      - name: Check Windows PowerShell can autoload its own cmdlets
        shell: cmd
        run: powershell -NoProfile -Command "if (-not (Get-Command Get-FileHash -EA SilentlyContinue)) { Write-Error 'Get-FileHash unavailable — build-linux-cli.ps1 will fail'; exit 1 }; 'Get-FileHash OK'"

      # `shell: cmd` is load-bearing. The default shell for `run:` on
      # Windows runners is pwsh (PowerShell 7), and pwsh rewrites
      # PSModulePath for its children to its own module dirs. npm inherits
      # that and passes it to the Windows PowerShell 5.1 that
      # build:linux-cli spawns, which then cannot autoload
      # Microsoft.PowerShell.Utility — so Get-FileHash is undefined and the
      # script dies at its first hash, AFTER the cross-build has already
      # succeeded. Measured: identical PSModulePath via cmd works, via pwsh
      # does not. Keeping pwsh out of the chain is the fix.
      - name: Stage CLI resources
        working-directory: app
        shell: cmd
        run: npm run build:linux-cli

      # The musl CLI that step just cross-built, uploaded so a CLI change can
      # be smoke-tested on a real box (Rule #14) without a local build (Rule
      # #17): `gh run download <run> -n ymux-cli-linux-x64`. Not a rebake —
      # the committed resources/ymux-linux-x64 still moves only with a
      # release (CLAUDE.md). Added in Phase 104, whose session history is a
      # CLI change nothing else could have run.
      - name: Upload the staged Linux CLI
        uses: actions/upload-artifact@v7
        with:
          name: ymux-cli-linux-x64
          path: app/src-tauri/resources/ymux-linux-x64
          if-no-files-found: error

      - name: cargo test
        working-directory: app/src-tauri
        run: cargo test --workspace

      # The staging script rewrites remote-manifest.json with a fresh
      # built_at every run. Per CLAUDE.md #12 that churn is cosmetic — but
      # a changed sha256 means the CLI binary actually moved, which is
      # worth seeing in the log rather than discovering at release time.
      - name: Report staged-resource drift
        if: always()
        working-directory: app
        shell: pwsh
        run: |
          $diff = git diff --unified=0 -- src-tauri/resources/remote-manifest.json
          if ($diff -match '"sha256"') {
            Write-Host "::notice::remote-manifest sha256 changed — the staged CLI binary differs from the committed one"
            Write-Host $diff
          } else {
            Write-Host "remote-manifest: timestamp-only churn (expected)"
          }

  # ---------------------------------------------------------------
  # Go control-plane server (app/src-tauri/server), on ubuntu.
  #
  # The only thing that ever ships is the two Linux binaries embedded by
  # src/addons.rs — so linux IS the target platform, and `go test` here
  # covers it directly (the old GOOS=windows run was an accident of the
  # runner). The build is CGO-free (modernc.org/sqlite), so no cross
  # toolchain is needed. The sdk drift-guard lives here too because it
  # shells into the server (`go run ./cmd/ymux-server openapi`).
  # ---------------------------------------------------------------
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: app/src-tauri/server/go.mod
          cache-dependency-path: app/src-tauri/server/go.sum

      - name: go vet
        working-directory: app/src-tauri/server
        run: go vet ./...

      - name: go test
        working-directory: app/src-tauri/server
        run: go test ./...

      # Same flags as docs/ymux-server/README.md § Build, so this is the
      # release cross-build and not an approximation of it. `-o <dir>/ ./...`
      # covers every package, not just ./cmd — packages nothing imports
      # would otherwise never be compiled at all — and the ymux-server
      # binary it produces IS the artifact, so no second per-arch compile.
      - name: go build (linux/amd64 + linux/arm64)
        working-directory: app/src-tauri/server
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/server-out"
          mkdir -p "$out"
          for pair in amd64:x64 arm64:arm64; do
            goarch="${pair%%:*}"
            name="${pair##*:}"
            echo "--- linux/$goarch"
            # Go requires the output directory to already exist.
            mkdir -p "$RUNNER_TEMP/gobuild-$goarch"
            GOARCH="$goarch" go build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/gobuild-$goarch/" ./...
            cp "$RUNNER_TEMP/gobuild-$goarch/ymux-server" "$out/ymux-server-linux-$name"
          done
          ls -l "$out"

      # Uploaded so a rebake (see the drift gate below) is "download this
      # artifact, drop the two files into src-tauri/resources/, commit" —
      # no Go toolchain on the dev box, and the binary that lands in the
      # repo is the one CI built from the reviewed source.
      - name: Upload cross-built server binaries
        uses: actions/upload-artifact@v7
        with:
          name: ymux-server-linux
          path: ${{ runner.temp }}/server-out/ymux-server-linux-*
          if-no-files-found: error

      # THE STALENESS GATE. resources/ymux-server-linux-{x64,arm64} are
      # committed blobs baked by hand (docs/ymux-server/README.md §Build,
      # docs/DECISIONS.md:298). Nothing in the desktop build reads the Go
      # source — src/addons.rs `include_bytes!`s the blobs — so a change
      # under server/ that skips the rebake is green in every job and
      # ships the OLD server to every remote. This is the only thing that
      # says so.
      #
      # Deliberately NOT a byte-compare against the fresh cross-build
      # above: Go output is reproducible only for a fixed toolchain patch
      # version, and setup-go resolves `go 1.26` to whatever 1.26.x is
      # current — that check would go red on a Go point release for a
      # reason that has nothing to do with the change.
      #
      # Test files are excluded: they do not reach the binary.
      - name: Assert the embedded server binaries were rebaked
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "no usable base commit (new branch / force-push) — nothing to diff against"
            exit 0
          fi
          # The checkout is shallow; fetch just the base commit so a
          # two-dot diff has both trees. Three-dot would need the merge
          # base, i.e. real history — and on a PR the checked-out ref is
          # already base-merged, so two-dot IS the PR diff.
          git fetch --no-tags --depth=1 origin "$base"
          changed=$(git diff --name-only "$base" HEAD)
          src=$(printf '%s\n' "$changed" | grep -E '^app/src-tauri/server/.*\.(go|mod|sum)$' | grep -v '_test\.go$' || true)
          baked=$(printf '%s\n' "$changed" | grep -E '^app/src-tauri/resources/ymux-server-linux-(x64|arm64)$' || true)
          if [ -n "$src" ] && [ -z "$baked" ]; then
            echo "::error::Go server source changed but resources/ymux-server-linux-{x64,arm64} did not. The desktop embeds those blobs (src/addons.rs), so this change would ship the OLD server. Rebake: download the 'ymux-server-linux' artifact from this run into app/src-tauri/resources/ and commit, or build locally per docs/ymux-server/README.md § Build."
            printf '%s\n' "$src" | sed 's/^/  changed: /'
            exit 1
          fi
          if [ -n "$src" ]; then
            echo "server source changed and the embedded binaries were rebaked alongside it — OK"
          else
            echo "no shipping Go source changed — nothing to rebake"
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk-gen/package-lock.json

      # The SDK drift-guard: sdk-gen/ci-check.mjs regenerates the OpenAPI
      # spec straight out of the server (`go run ./cmd/ymux-server openapi`)
      # plus the TS/Kotlin clients, and fails if the committed output
      # moved. Not running it here is exactly how ~670 lines of already-
      # stale generated output rode into the rename commit unnoticed
      # (FOLLOWUPS P2, 2026-08-18) — same "server changed, derived
      # artifact didn't" family as the gate above.
      - name: Install sdk-gen deps
        working-directory: sdk-gen
        run: npm ci

      - name: SDK drift-guard
        run: node sdk-gen/ci-check.mjs
