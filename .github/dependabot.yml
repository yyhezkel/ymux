# Why this file exists: nothing was watching the action pins, so the whole set
# drifted onto the deprecated node20 runtime at once and only surfaced as a
# runner warning. Monthly grouped PRs keep that from happening again.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      # One PR a month for the whole set, not seven separate ones.
      actions:
        patterns: ["*"]
    # READ THIS BEFORE MERGING A BUMP OF dtolnay/rust-toolchain.
    # That pin is the SHA of the `stable` BRANCH. The only tag in the repo,
    # v1, points at `master`, where `toolchain` is a required input with no
    # default -- so a bump onto it silently switches branches. Every call site
    # passes `toolchain: 1.95.0` explicitly (equal to rust-toolchain.toml) to survive that, but check the
    # proposed SHA is still on `stable` rather than trusting the diff.
    #
    # npm and cargo are deliberately NOT enabled here yet: turning them on
    # would open a wave of PRs against dependency trees nobody has reviewed.
    # Tracked in BACKLOG.md.
