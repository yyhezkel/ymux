# Why this file exists: nothing was watching the action pins, so the whole set
# drifted onto the deprecated node20 runtime at once and only surfaced as a
# runner warning. Monthly grouped PRs keep that from happening again.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      # One PR a month for the whole set, not seven separate ones.
      actions:
        patterns: ["*"]
    # READ THIS BEFORE MERGING A BUMP OF dtolnay/rust-toolchain.
    # That pin is the SHA of the `stable` BRANCH. The only tag in the repo,
    # v1, points at `master`, where `toolchain` is a required input with no
    # default -- so a bump onto it silently switches branches. Every call site
    # passes `toolchain: 1.95.0` explicitly (equal to rust-toolchain.toml) to survive that, but check the
    # proposed SHA is still on `stable` rather than trusting the diff.

  # npm and cargo are lockfile-only on purpose. A manifest edit moves a file
  # the vault covers, and a bot branch cannot re-stamp .vault-lock.json, so
  # any such PR would be red. Lockfile-only also freezes the `=` and `~` pins.
  # The tauri ignores cover the `^2` siblings: they move by hand, together
  # (CLAUDE.md, Pinned deps).
  # sdk-gen and sdk/typescript are listed because 12 of the 19 alerts open on
  # 2026-11-10 sat in their lockfiles with nothing watching them. sdk-gen pins
  # its two generators exactly, so only transitive packages move there, and
  # sdk-gen/ci-check.mjs (the `go` job) fails if the generated SDK changes.
  # The *-security groups below only fire while "Dependabot security updates"
  # is enabled in the repo settings. It was off until 2026-11-10.
  # gomod is absent on purpose: a go.mod change needs the two server blobs
  # rebaked, which a bot branch cannot do. Go alerts arrive without an entry.
  - package-ecosystem: npm
    directories:
      - "/app"
      - "/sdk-gen"
      - "/sdk/typescript"
    schedule:
      interval: monthly
    versioning-strategy: lockfile-only
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "@tauri-apps/*"
    groups:
      npm:
        applies-to: version-updates
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: "/app/src-tauri"
    schedule:
      interval: monthly
    versioning-strategy: lockfile-only
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "tauri*"
    groups:
      cargo:
        applies-to: version-updates
        patterns: ["*"]
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]
