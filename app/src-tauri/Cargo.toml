[workspace]
members = [".", "cli", "mcp", "crates/ymux-types", "crates/ymux-core", "crates/ymux-tunnel", "crates/ymux-bootstrap", "crates/ymux-ssh", "crates/ymux-policy", "crates/ymux-addons", "crates/ymux-protocol"]
resolver = "2"

# Pre-public hardening: strip symbols from release builds. The
# `--remap-path-prefix` rustflags in `.cargo/config.toml` scrub the
# developer's $HOME from any embedded panic-location strings — those
# come from `file!()` macros in the dependency tree and are NOT debug
# symbols, so `strip` alone doesn't cover them.
[profile.release]
strip = "symbols"

[package]
name = "app"
version = "0.5.1"
description = "ymux"
authors = ["yossi"]
edition = "2021"

[lib]
name = "app_lib"
# Desktop-only: `main.rs` does `app_lib::run()`, so an rlib is all that is
# linked. The Tauri template ships `["staticlib", "cdylib", "rlib"]` for
# mobile (iOS wants the staticlib, Android the cdylib) — and there is no
# gen/android or gen/apple here. Building all three cost a 215 MB
# `app_lib.lib` archive plus a second full link of the whole object graph
# (down to a 456 KB DLL nothing loads) on EVERY build, CI included.
# If mobile lands, put the other two back — that is the whole change.
crate-type = ["rlib"]

[[bin]]
name = "app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Pinned + unstable feature for tauri::Window::add_child (multi-webview
# support for Phase 53 browser-per-workspace). The "unstable" feature
# gate is Tauri's documented path for multi-webview in 2.x. Manual
# review required before any version bump — `Window::add_child`'s
# signature can change between minors.
# `devtools` (Phase 82.E): the ONLY thing that makes wry call
# `setInspectable(true)` on macOS, i.e. the only way Safari's Develop menu
# can attach to the workspace Browser webview in a release build.
# DANGER: tauri-runtime-wry reads this as `devtools.unwrap_or(true)`, so
# enabling the feature makes EVERY webview inspectable by default —
# including `main`, which renders live PTY output (Rule #1). The explicit
# `.devtools(false)` on the main and popout window builders in lib.rs is
# what keeps that from happening; they are not optional.
tauri = { version = "=2.10.3", features = ["unstable", "tray-icon", "image-png", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Phase 65: zero sensitive bytes (initial SSH password) in memory after
# use — CLAUDE.md Rule #2.
zeroize = "1"
portable-pty = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
bytes = "1"
russh = "0.49"
russh-keys = "0.49"
russh-sftp = "2"
async-trait = "0.1"
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"
dirs = "5"
notify-rust = "4"
whoami = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
base64 = "0.22"
# v0.2.3 → beta.3 (netfree): native HTTPS client for the updater.
# History: v0.2.2 used SChannel (native-tls) — some AV/EDR products
# intercepted its TLS and broke "Check for updates".
# v0.2.3 switched to rustls (webpki-roots) to bypass AV interception,
# but that path ignores the Windows Certificate Store — so users behind
# Netfree (Israeli ISP MITM filter, custom root cert in Windows store)
# couldn't reach GitHub / manifest.json / NSIS at all.
# beta.3: rustls + `native-certs` — rustls stays (no SChannel, so the
# AV-interception fix holds), but the trust roots come from the Windows
# Certificate Store instead of the compiled-in webpki list. Any content
# filter (Netfree, Etrog, Rimon, ...) whose installer drops its root into
# the store Just Works — no per-vendor logic, no fallback path.
# Note: the store is snapshotted once per process (Lazy static inside
# ureq) — a root installed while the app is running needs an app restart.
ureq = { version = "2", features = ["native-certs", "json"] }
# Phase 35 (#1.5): generate TypeScript type bindings from Rust structs.
# `cargo test` regenerates app/src/bindings/*.ts; the frontend imports
# from there instead of hand-mirroring the data model.
ts-rs = "8"
# Phase 51.A (#3.1): pure data types live in a sub-crate so future
# splits can depend on the type-set without dragging in tauri.
ymux-types = { path = "crates/ymux-types" }
# Phase 51.B: cross-cutting infra (dlog, shell_quote, helpers).
# Landing in incremental sub-commits (51.B1, 51.B2, …); only the
# lowest-coupling pieces live here initially.
ymux-core = { path = "crates/ymux-core" }
# Phase 51.C: HMAC handshake + bridge_to_pipe (the reverse-tunnel).
ymux-tunnel = { path = "crates/ymux-tunnel" }
# Phase 51.D: remote CLI bootstrap (russh+sftp deploy logic).
ymux-bootstrap = { path = "crates/ymux-bootstrap" }
# Phase 51.H: SSH auth primitives (try_authenticate + try_agent_auth).
ymux-ssh = { path = "crates/ymux-ssh" }
# Phase 66: shared 3-state tool-permission policy engine (auto/gate/block).
ymux-policy = { path = "crates/ymux-policy" }
# Phase 68.A: add-on manifest schema + registry (ts feature → bindings).
ymux-addons = { path = "crates/ymux-addons", features = ["ts"] }
# Phase 57: zip/unzip on the local side of the file manager. Default
# features include `deflate` which covers the common-case .zip
# everyone produces; AES + Bzip2 + Zstd are turned off to keep the
# binary lean — agents we package don't routinely emit those.
zip = { version = "2", default-features = false, features = ["deflate", "time"] }
# beta.3-lh-insights: native local Insights for Local workspaces (Windows-first).
# sysinfo covers CPU/mem/disks/net/processes cross-platform without WMI plumbing.
# bollard 0.17 auto-pulls hyper-named-pipe under `[target.'cfg(windows)']`,
# so Windows Docker Desktop's `\\.\pipe\docker_engine` transport is available
# without an extra feature flag. If Docker isn't running we return an empty
# containers list rather than erroring.
sysinfo = "0.32"
bollard = { version = "0.17", default-features = false }
# Direct dep for `StreamExt` on bollard's stats stream.
futures-util = "0.3"
# Reading the system clipboard. WebView2 allows navigator.clipboard.WRITE
# but gates READ behind a permission the host has to grant, which Tauri
# does not by default — so Copy worked in the terminal and Paste silently
# rejected. A host-side read sidesteps the web permission entirely.
# arboard rather than hand-rolled Win32: the same crate Tauri's own
# clipboard plugin uses, and it keeps the macOS port working too.
arboard = "3"

# Font install (per-user, no admin): open the downloaded .ttf with the shell
# for the guided fallback. Already in the tree via tauri-plugin-opener, so
# naming it directly costs no extra build time.
open = "5"

# Windows-only direct deps. The WSL smart-install and font-install branches
# each landed a cfg(windows) section in the same release; merged into one.
# Both crates are already in the tree transitively, so these are direct-dep
# declarations rather than new builds.
#   winreg      — register an installed font under HKCU (no elevation needed).
#   windows-sys — WSL preflight (process-token elevation check + the
#                 ShellExecuteEx("runas") path that runs `wsl --install`
#                 elevated), and the WM_FONTCHANGE broadcast that makes a
#                 newly installed face usable without a reboot.
# Pinned at the higher of the two versions the branches asked for (0.61, from
# the WSL path). The font code needs only Win32_Foundation +
# Win32_UI_WindowsAndMessaging, both of which are in this feature set.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    # SHELLEXECUTEINFOW carries an HKEY field, so the Shell struct is
    # gated behind the Registry feature even though we never touch it.
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Phase 50 (#2.4): integration test for diff_pane::fetch_diff against a
# real git repo seeded under a temporary directory.
tempfile = "3"
