[package]
name = "ymux-ssh"
version = "0.0.0"
edition = "2021"
publish = false
description = "Phase 51.H: pure SSH authentication primitives (no AppState dependency)"

[dependencies]
ymux-core = { path = "../ymux-core" }
russh = { version = "0.65", default-features = false, features = ["flate2", "ring", "rsa"] }
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }

[dev-dependencies]
ymux-core = { path = "../ymux-core", features = ["test-config-dir"] }
