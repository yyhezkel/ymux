[package]
name = "ymux-bootstrap"
version = "0.0.0"
edition = "2021"
publish = false
description = "Phase 51.D: deploy the Linux ymux CLI to a remote SSH server (no tauri dep)"

[dependencies]
ymux-core = { path = "../ymux-core" }
russh = { version = "0.65", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "~2.1.2"
tokio = { version = "1", features = ["sync", "rt", "io-util", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"

[dev-dependencies]
ymux-core = { path = "../ymux-core", features = ["test-config-dir"] }
