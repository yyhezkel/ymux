[package]
name = "ymux-tunnel"
version = "0.0.0"
edition = "2021"
publish = false
description = "Phase 51.C: HMAC handshake + reverse-tunnel bridge to the Named Pipe RPC server"

[dependencies]
ymux-core = { path = "../ymux-core" }
russh = { version = "0.65", default-features = false, features = ["flate2", "ring", "rsa"] }
tokio = { version = "1", features = ["sync", "rt", "io-util", "macros", "net"] }
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
tracing = "0.1"

[dev-dependencies]
ymux-core = { path = "../ymux-core", features = ["test-config-dir"] }
