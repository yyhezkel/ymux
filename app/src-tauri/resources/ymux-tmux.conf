# ymux-tmux.conf
#
# Bundled with the ymux desktop. The bootstrap uploads this file to
# `~/.ymux/tmux.conf` on every server it provisions. The tmux attach
# passes `-f ~/.ymux/tmux.conf` (read only when the SERVER starts) AND
# chains `source-file -q ~/.ymux/tmux.conf` onto every attach, so a
# server that was already running adopts an updated conf without a
# kill-server. Everything below is therefore written to be RE-SOURCED
# SAFELY: every `-a` append has a `-u` reset in front of it, and every
# other line is a plain set / unbind / bind that lands the same twice.
#
# Toggleable from Settings -> Terminal -> "Use ymux tmux config". When
# off, plain `tmux new-session -A` runs and the user's own
# ~/.tmux.conf (if any) applies -- nothing here is loaded or sourced.
#
# Companion to ymux-zellij.kdl, and it buys the same invariant:
#
#     1 ymux pane == 1 tmux session == 1 window == exactly 1 tmux pane,
#     with zero tmux chrome.
#
# tmux is a PERSISTENCE LAYER underneath a ymux pane, not a multiplexer
# the user drives. ymux owns tabs, splits and the window; tmux owns the
# pane's scrollback and outlives the SSH channel. A line earns its place
# here only if the invariant breaks without it -- and this file REPLACES
# the user's own config (`-f`), it does not merge with it.
#
# Key NAMES matter everywhere below: an unknown key in `bind` aborts this
# whole file and takes the session with it (Phase 65 CRITICAL, 2026-06-25:
# `S-PageUp` instead of `S-PPage` killed every session for five builds).
# A unit test in lib.rs (`tmux_attach_script_tests`) pins the allowed key
# names and the `-u` / `-a` pairing -- extend it when you extend this.

# --- Mouse -----------------------------------------------------------
# OFF, and nothing turns it back on (2026-09-08, Phase 91.B). Phase 60 set
# this; Phase 65 EE then re-enabled it per attach (`\; set -g mouse on`)
# for wheel scrollback, and that injection is gone. The wheel was never
# the problem -- LEFT-CLICK was: with tmux tracking the mouse, a click
# lands on whatever tmux happens to be drawing at that instant, and
# Claude Code redraws several times a second, so clicks selected and
# pasted things nobody aimed at. With mouse off, xterm.js owns every
# button:
#   - left-drag   = native xterm.js selection; Ctrl+Shift+C copies (or
#                   plain Ctrl+C with the copy-on-select setting)
#   - right-click = ymux's own Copy / Paste / Select-all menu
#   - wheel       = reaches nothing useful: tmux holds the alt screen,
#                   so xterm.js has no scrollback of its own here, and
#                   with mouse off tmux never sees the wheel. Scrollback
#                   is the KEYBOARD -- PageUp below, or Ctrl+b [.
# Apps that track the mouse themselves (Claude Code fullscreen, vim
# with mouse=a, htop) still get it: tmux forwards their DECSET to
# xterm.js regardless of this option.
set -g mouse off

# Bigger ring buffer than tmux's 2000-line default.
set -g history-limit 50000

# --- Zero chrome -----------------------------------------------------
# The ymux pane header and the sidebar already name the session; the
# status row cost every pane one line for a "[0] 0:bash*" nobody read.
# tmux messages (copy-mode's [N/50000] counter, errors) still overlay
# the bottom line while they are shown.
set -g status off

# --- Zero prefix keys, then exactly three ----------------------------
# tmux's default prefix table is ~80 bindings, and in a pane that is one
# shell and nothing else every one of them is a trap: Ctrl+b % or "
# splits INSIDE the ymux pane (ymux owns splits), c/n/p/w open and walk
# windows the sidebar cannot see, x/& kill things, z zooms, $/, rename,
# : opens a command prompt that can do all of the above, ? lists keys
# that no longer exist. Cleared wholesale rather than one by one so a
# key a later tmux adds is cleared too. Ctrl+b itself stays the prefix.
#
# ONLY the prefix table. The root table holds nothing but tmux's mouse
# bindings (inert with mouse off, and sane if a power user flips it
# on), and copy-mode / copy-mode-vi MUST survive -- they are how the
# keyboard moves through scrollback once inside it (arrows,
# PageUp/PageDown, g/G, q or Escape to leave; mode-keys stays default).
unbind -a -T prefix
# Ctrl+b [ -- copy-mode, the scrollback viewer. Selection + Enter copies
# to the tmux buffer AND, via set-clipboard below, to the local clipboard.
bind [ copy-mode
# Ctrl+b d -- detach. ymux never needs it (closing the pane closes the
# channel and the session survives), but it is the documented way out.
bind d detach-client
# Ctrl+b Ctrl+b -- a literal Ctrl+b for the program inside. Without this
# the prefix key is unreachable for every app that uses it (Claude Code
# binds Ctrl+b to "run in background").
bind C-b send-prefix

# --- Keyboard scrollback ---------------------------------------------
# With the wheel gone (see Mouse), PageUp at a shell prompt -- or under
# Claude Code, which runs on the MAIN screen unless fullscreen -- enters
# copy-mode one page up. Inside an alt-screen app (vim, less, man, htop,
# Claude Code fullscreen) it passes through untouched, so those keep
# paging themselves. `-e` leaves copy-mode again the moment you scroll
# back down past the live screen, so a pane never stays frozen by
# accident. Inside copy-mode this bind is never reached: a pane in a
# mode consults the mode's table first, and both copy-mode tables bind
# PPage themselves. No PageDown twin -- outside copy-mode it has nothing
# to do. No `-t =` on a KEY bind: `=` is the mouse target and errors on
# a key press. No Shift variant: xterm.js consumes Shift+PageUp itself.
bind -n PPage if-shell -F "#{alternate_on}" "send-keys PPage" "copy-mode -eu"

# --- Display ---------------------------------------------------------
# Phase 55-C: re-pick the smallest client size when a ymux pane
# resizes. Without this, tmux uses the largest attached client's
# geometry, which leaves narrow trailing columns black on the
# new smaller pane. Aggressive-resize re-fits the inner window to
# the active client right after a SIGWINCH -- the trade-off is that
# alt-screen apps (vim, htop) see their full terminal area shrink
# on every resize, which is exactly what we want for ymux.
set -g aggressive-resize on

# 256-colour + truecolour. xterm.js advertises both.
# `-u` resets the option to tmux's default FIRST so a re-source (every
# attach) does not append one more copy of each override per pane.
set -g default-terminal "tmux-256color"
set -gu terminal-overrides
set -ga terminal-overrides ",*256col*:Tc"

# Phase 79: OSC 52 clipboard PASS THROUGH. Claude Code's fullscreen mode
# (alt-screen + SGR mouse) can't use drag-selection, so it copies by
# emitting OSC 52 (`\e]52;c;<base64>\e\\`). Inside tmux that sequence is
# intercepted, and tmux only re-emits it to the outer terminal (xterm.js,
# which handles OSC 52 via its ClipboardAddon) when BOTH hold:
#   1. set-clipboard is on, and
#   2. the outer terminal is declared to have the `Ms` clipboard capability.
# tmux-256color has no Ms entry, so without the override tmux silently
# swallows the copy -- the "sent N chars via OSC 52" toast fires but nothing
# reaches the Windows clipboard. Declaring Ms below closes that gap.
# Version-agnostic: set-clipboard exists since 1.5, terminal-overrides Ms
# works on every tmux that has clipboard support. (The `-u` reset above
# covers this append too -- keep them in this order.)
set -g set-clipboard on
set -ga terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\007'

# Phase 62.B (item J): let tmux PASS THROUGH OSC 8 hyperlinks to the
# outer terminal (xterm.js) so Claude Code's clickable file links
# survive inside a tmux session -- without this tmux strips them.
# `terminal-features` is tmux 3.2+, so guard it (older tmux would error
# on the unknown option and abort sourcing the rest of this file).
%if "#{>=:#{version},3.2}"
set -gu terminal-features
set -ga terminal-features ",*:hyperlinks"
%endif

# Pass through focus events so editors (vim, emacs) know when the
# ymux pane regains focus and can autoread changed files.
set -g focus-events on

# A long enough escape-time so Ctrl+arrows etc. don't get mis-decoded,
# but short enough that ESC in vim doesn't feel laggy.
set -sg escape-time 30
